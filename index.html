<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dreamy icecream</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">
    <h1>dreamy icecream</h1>
    <p>taste your sweetest dream</p>
    <a href="#flavors" class="btn">explore flavors</a>
  </section>

  <section id="flavors" class="flavors">
    <h2>our flavors</h2>

    <div class="cards">
      <div class="card">
        <h3>lavender cloud</h3>
        <p>soft, floral, smooth</p>
      </div>

      <div class="card">
        <h3>sunshine mango</h3>
        <p>bright, tropical, happy</p>
      </div>

      <div class="card">
        <h3>matcha dream</h3>
        <p>earthy, creamy, calm</p>
      </div>
    </div>
  </section>

</body>
</html>
