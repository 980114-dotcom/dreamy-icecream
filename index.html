<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dreamy icecream</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">
    <h1>dreamy icecream</h1>
    <p>taste your sweetest dream</p>
    <a href="#flavors" class="btn">explore flavors</a>
  </section>

  <section id="flavors" class="flavors">
  <h2>our flavors</h2>

  <div class="flavor-grid">

    <div class="flavor-card">
      <img src="images/solo-strawberry.jpg" alt="solo strawberry">
      <h3>solo strawberry</h3>
    </div>

    <div class="flavor-card">
      <img src="images/mango-monster.jpg" alt="mango monster">
      <h3>mango monster</h3>
    </div>

    <div class="flavor-card">
      <img src="images/crunchy-apple.jpg" alt="crunchy apple">
      <h3>crunchy apple</h3>
    </div>

    <div class="flavor-card">
      <img src="images/birthday-party.jpg" alt="birthday party">
      <h3>birthday party</h3>
    </div>

    <div class="flavor-card">
      <img src="images/muddy-snowman.jpg" alt="muddy snowman">
      <h3>muddy snowman</h3>
    </div>

    <div class="flavor-card">
      <img src="images/unicorn-dream.jpg" alt="unicorn dream">
      <h3>unicorn dream</h3>
    </div>

  </div>
</section>

</body>
</html>
